    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    
    /* Real-Time Google Map Overrides */
    .leaflet-container { width: 100%; height: 100%; background: #0b1120; font-family: ui-sans-serif, system-ui, sans-serif; z-index: 1 !important; isolation: isolate; }
    .leaflet-popup-content-wrapper { background: #0f172a !important; color: #f8fafc !important; border: 1px solid #334155; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .leaflet-popup-tip { background: #0f172a !important; }
    .leaflet-popup-content { margin: 12px 14px; line-height: 1.4; }
    
    @keyframes pulseRing {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    .pulse-ring { animation: pulseRing 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .pulse-red { background-color: rgba(239, 68, 68, 0.5); }
    .pulse-amber { background-color: rgba(245, 158, 11, 0.5); }
    .pulse-emerald { background-color: rgba(16, 185, 129, 0.5); }
    .pulse-blue { background-color: rgba(59, 130, 246, 0.6); }

    /* Google Maps Live GPS Pinpoint Animations */
    @keyframes googleGpsPulse {
      0% { transform: scale(0.6); opacity: 0.95; }
      70% { transform: scale(2.3); opacity: 0; }
      100% { transform: scale(2.3); opacity: 0; }
    }
    .google-gps-halo {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      background: rgba(66, 133, 244, 0.35);
      border: 1.5px solid rgba(66, 133, 244, 0.7);

      pointer-events: none;
    }
    
    /* High-contrast Google Maps Dark Tactical */
    .dark-tactical-tiles {
      filter: invert(95%) hue-rotate(180deg) brightness(85%) contrast(120%) saturate(75%) !important;
    }
    .leaflet-control-zoom { border: 1px solid #334155 !important; border-radius: 10px !important; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important; }
    .leaflet-control-zoom a { background-color: #0f172a !important; color: #f8fafc !important; border-color: #334155 !important; }
    .leaflet-control-zoom a:hover { background-color: #1e293b !important; color: #34d399 !important; }
    .leaflet-control-attribution { background: rgba(15, 23, 42, 0.85) !important; color: #94a3b8 !important; font-size: 10px !important; backdrop-filter: blur(4px); border-top-left-radius: 8px; }
    .leaflet-control-attribution a { color: #38bdf8 !important; }

    /* Marker scale-up & pulse on stream hover */
    .marker-hovered {

      z-index: 1500 !important;

      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);

    .marker-selected {

      z-index: 1600 !important;

    }
  </style>

    // Helper: Dynamic Relative Time ("18m ago", "2h ago", "1d ago")
    function getRelativeTime(dateString) {
      if (!dateString) return 'recently';
      const elapsed = Math.floor((Date.now() - new Date(dateString).getTime()) / 1000);
      if (elapsed < 60) return `${Math.max(1, elapsed)}s ago`;
      const mins = Math.floor(elapsed / 60);
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return `${days}d ago`;
    }

    // Helper: Ray-Casting Point-in-Polygon (Turf.js compatible spatial filter)
    function isPointInPolygon(point, polygon) {
      const lat = point[0];
      const lng = point[1];
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i][1], yi = polygon[i][0];
        const xj = polygon[j][1], yj = polygon[j][0];
        const intersect = ((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // Feature 5: Mini 24h SVG Sparkline Component
    function HourlySparkline({ width = 120, height = 26 }) {
      const data = useMemo(() => [2, 3, 1, 4, 3, 5, 2, 6, 8, 4, 5, 7, 3, 6, 9, 8, 5, 7, 11, 8, 9, 12, 10, 14], []);
      
      const { points, areaPoints } = useMemo(() => {
        const min = Math.min(...data);
        const max = Math.max(...data);
        const range = max - min || 1;
        const step = width / (data.length - 1);
        const pts = data.map((v, i) => {
          const x = i * step;
          const y = height - 2 - ((v - min) / range) * (height - 6);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');
        return {
          points: pts,
          areaPoints: `0,${height} ${pts} ${width},${height}`,
        };
      }, [data, width, height]);

      return (
        <div className="flex items-center gap-2 px-2.5 py-1 rounded-lg bg-slate-900/90 border border-slate-800 shadow-inner">
          <div className="flex flex-col">
            <span className="text-[9px] font-mono text-slate-400 font-semibold tracking-wider uppercase">24H Volume</span>
            <span className="text-[10px] font-mono font-bold text-emerald-400">42 Incidents</span>
          </div>
          <svg width={width} height={height} className="overflow-visible">
            <defs>
              <linearGradient id="sparklineGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#10b981" stopOpacity="0.35" />
                <stop offset="100%" stopColor="#10b981" stopOpacity="0.0" />
              </linearGradient>
            </defs>
            <polygon points={areaPoints} fill="url(#sparklineGrad)" />
            <polyline points={points} fill="none" stroke="#10b981" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        </div>
      );
    }

    // Feature 3: Media & Proof Thumbnail with Skeleton Loader and Zero CLS
    function ProofThumbnail({ src, alt }) {
      const [loaded, setLoaded] = useState(false);
      const [hasError, setHasError] = useState(false);

      if (!src || hasError) {

            </div>
          )}

            src={src}
            alt={alt || "Proof thumbnail"}
            onLoad={() => setLoaded(true)}
            onError={() => setHasError(true)}
