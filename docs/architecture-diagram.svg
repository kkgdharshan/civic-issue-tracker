<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  <!-- Header -->
  <text x="480" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    CIVICPULSE: HIGH-CONCURRENCY DISTRIBUTED ARCHITECTURE
  </text>
  <text x="480" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#10b981" text-anchor="middle" letter-spacing="2">
    GEO-PARTITIONED EVENT MESH &amp; WRITE-BEHIND BUFFERING
  </text>

  <!-- Tier 1: Client Layer -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="180" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="65" cy="135" r="8" fill="#10b981"/>
    <text x="82" y="140" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Client Devices</text>
    <text x="65" y="165" font-family="sans-serif" font-size="11" fill="#94a3b8">• Next.js 14 PWA</text>
    <text x="65" y="182" font-family="sans-serif" font-size="11" fill="#94a3b8">• IndexedDB Offline Store</text>
    <text x="65" y="199" font-family="sans-serif" font-size="11" fill="#94a3b8">• Canvas Image Stripping</text>
  </g>

  <!-- Tier 2: Edge & Ingress -->
  <g filter="url(#shadow)">
    <rect x="270" y="110" width="180" height="100" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="295" cy="135" r="8" fill="#38bdf8"/>
    <text x="312" y="140" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Edge CDN / WAF</text>
    <text x="295" y="165" font-family="sans-serif" font-size="11" fill="#94a3b8">• Cloudflare DDoS Shield</text>
    <text x="295" y="182" font-family="sans-serif" font-size="11" fill="#94a3b8">• Anycast Geo-Routing</text>
    <text x="295" y="199" font-family="sans-serif" font-size="11" fill="#94a3b8">• Static Tile Edge Cache</text>
  </g>

  <!-- Tier 3: Compute Cluster -->
  <g filter="url(#shadow)">
    <rect x="500" y="110" width="190" height="100" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="525" cy="135" r="8" fill="#a855f7"/>
    <text x="542" y="140" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">App Router Cluster</text>
    <text x="525" y="165" font-family="sans-serif" font-size="11" fill="#94a3b8">• Zod Schema Validator</text>
    <text x="525" y="182" font-family="sans-serif" font-size="11" fill="#94a3b8">• Idempotency Lock Guard</text>
    <text x="525" y="199" font-family="sans-serif" font-size="11" fill="#94a3b8">• Transactional Outbox</text>
  </g>

  <!-- Tier 4: Redis Cluster -->
  <g filter="url(#shadow)">
    <rect x="740" y="110" width="180" height="100" rx="12" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="765" cy="135" r="8" fill="#f43f5e"/>
    <text x="782" y="140" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Redis 7.2 Cluster</text>
    <text x="765" y="165" font-family="sans-serif" font-size="11" fill="#94a3b8">• Sliding Window Rate Limit</text>
    <text x="765" y="182" font-family="sans-serif" font-size="11" fill="#94a3b8">• Upvote Write-Behind Buf</text>
    <text x="765" y="199" font-family="sans-serif" font-size="11" fill="#94a3b8">• Real-time Pub/Sub Stream</text>
  </g>

  <!-- Connectors Row 1 -->
  <path d="M 220 160 L 270 160" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 450 160 L 500 160" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 690 160 L 740 160" stroke="#a855f7" stroke-width="2"/>

  <!-- Tier 5: Database Layer (Postgres + PostGIS) -->
  <g filter="url(#shadow)">
    <rect x="500" y="270" width="190" height="110" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="525" cy="295" r="8" fill="#10b981"/>
    <text x="542" y="300" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">PostgreSQL 16 + PostGIS</text>
    <text x="525" y="325" font-family="sans-serif" font-size="11" fill="#94a3b8">• geography(Point, 4326)</text>
    <text x="525" y="342" font-family="sans-serif" font-size="11" fill="#94a3b8">• Spatial GiST R-Tree Index</text>
    <text x="525" y="359" font-family="sans-serif" font-size="11" fill="#94a3b8">• 5km ST_DWithin Queries</text>
  </g>

  <!-- Tier 6: BullMQ Worker Cluster -->
  <g filter="url(#shadow)">
    <rect x="740" y="270" width="180" height="110" rx="12" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="765" cy="295" r="8" fill="#fbbf24"/>
    <text x="782" y="300" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">BullMQ Workers</text>
    <text x="765" y="325" font-family="sans-serif" font-size="11" fill="#94a3b8">• Gemini AI Multimodal</text>
    <text x="765" y="342" font-family="sans-serif" font-size="11" fill="#94a3b8">• Image EXIF Stripping</text>
    <text x="765" y="359" font-family="sans-serif" font-size="11" fill="#94a3b8">• Async Outbox Consumer</text>
  </g>

  <!-- Tier 7: AWS S3 Asset Lake -->
  <g filter="url(#shadow)">
    <rect x="270" y="270" width="180" height="110" rx="12" fill="url(#cardGrad)" stroke="#f97316" stroke-width="1.5"/>
    <circle cx="295" cy="295" r="8" fill="#f97316"/>
    <text x="312" y="300" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">AWS S3 Object Lake</text>
    <text x="295" y="325" font-family="sans-serif" font-size="11" fill="#94a3b8">• Direct Presigned Uploads</text>
    <text x="295" y="342" font-family="sans-serif" font-size="11" fill="#94a3b8">• 10MB Strict Bound Policy</text>
    <text x="295" y="359" font-family="sans-serif" font-size="11" fill="#94a3b8">• Zero Server RAM Overhead</text>
  </g>

  <!-- Connectors Row 2 -->
  <path d="M 595 210 L 595 270" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 830 210 L 830 270" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 740 325 L 690 325" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 130 210 C 130 325, 200 325, 270 325" stroke="#f97316" stroke-width="2" fill="none" stroke-dasharray="4,4"/>

  <!-- Footer Banner -->
  <rect x="40" y="440" width="880" height="60" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="475" font-family="monospace" font-size="12" fill="#10b981">● SYSTEM HIGHLIGHTS:</text>
  <text x="225" y="475" font-family="sans-serif" font-size="12" fill="#cbd5e1">50,000 Read QPS Edge Caching</text>
  <text x="445" y="475" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 2,500 Write-Behind Upvotes/sec</text>
  <text x="690" y="475" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Zero-Loss Offline Sync</text>
</svg>
